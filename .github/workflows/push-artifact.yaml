# Git -> signed OCI. On a push to main every component is validated, pushed
# under an immutable commit tag, keyless-signed (GitHub OIDC -> Fulcio, logged
# in Rekor), verified against this workflow's own identity, and only then is
# the `latest` channel tag moved to it. A failure at any step leaves `latest`
# on the previous signed artifact. Pull requests only validate.
name: push-artifact

on:
  push:
    branches: [main]
    paths: ['web-fleet/**', 'scripts/**', '.github/workflows/push-artifact.yaml']
  pull_request:
    paths: ['web-fleet/**', 'scripts/**', '.github/workflows/push-artifact.yaml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-artifact-${{ github.ref }}
  cancel-in-progress: false   # never abandon a half-promoted artifact

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate manifests against the CRD schemas
        run: ./scripts/validate.sh web-fleet
      - name: Fleet policy (replicas bounded, image is a prepared golden image)
        run: ./scripts/policy.py web-fleet

  publish:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push to GHCR with GITHUB_TOKEN (no stored registry secret)
      id-token: write   # keyless Cosign signing
    strategy:
      fail-fast: true
      matrix:
        include: [{component: web-fleet, path: web-fleet, suffix: '/web-fleet'}]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          version: 2.10.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push, sign, verify, promote
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          SRC_PATH: ${{ matrix.path }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}${SUFFIX}"
          tag="main-${GITHUB_SHA::12}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          flux push artifact "oci://${repo}:${tag}" \
            --path="${SRC_PATH}" \
            --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --revision="main@sha1:${GITHUB_SHA}" \
            --annotations="io.github.actions.run=${run_url}" \
            --output=json > push.json
          digest="$(jq -r .digest push.json)"
          ref="${repo}@${digest}"
          echo "pushed ${ref}"

          cosign sign --yes "${ref}"
          cosign verify "${ref}" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity="${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}" > /dev/null
          echo "signature verified for ${GITHUB_WORKFLOW_REF}"

          flux tag artifact "oci://${repo}:${tag}" --tag latest
          echo "promoted ${repo}:latest -> ${digest}"

          {
            echo "### ${COMPONENT}"
            echo "| | |"; echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| artifact | \`${repo}:${tag}\` |"
            echo "| digest | \`${digest}\` |"
            echo "| signer | \`${GITHUB_WORKFLOW_REF}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
