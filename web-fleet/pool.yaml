# The web VM fleet. Git owns replicas and the image; there is no autoscaler.
# Root disks are per-guest clones that are deleted with their guest (no
# volumeClaimTemplates), so a scale-in or rollout leaves no orphaned disks.
apiVersion: swift.kubeswift.io/v1alpha1
kind: SwiftGuestPool
metadata:
  name: web
  namespace: workloads
spec:
  replicas: 5
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2          # replace two VMs at a time ...
      maxUnavailable: 0    # ... retiring old VMs only as new ones run, so
                           # earlier replacements already serve HTTP when the
                           # last old VMs go (a pool counts a VM available at
                           # GuestRunning, before its HTTP server is up)
  service:
    type: ClusterIP
    ports:
      - name: http
        port: 80
        targetPort: 8080   # the HTTP endpoint baked into the golden image
  template:
    metadata:
      labels:
        app: web
    spec:
      imageRef: { name: web-v2 }
      guestClassRef: { name: fluxcon-web }
      seedProfileRef: { name: web }
      runPolicy: Running
